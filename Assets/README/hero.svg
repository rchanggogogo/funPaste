<svg width="1200" height="640" viewBox="0 0 1200 640" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="80" y1="20" x2="1120" y2="640" gradientUnits="userSpaceOnUse">
      <stop stop-color="#262E52"/>
      <stop offset="0.52" stop-color="#141A2D"/>
      <stop offset="1" stop-color="#0B0E19"/>
    </linearGradient>
    <linearGradient id="panel" x1="140" y1="120" x2="1060" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#293252"/>
      <stop offset="1" stop-color="#171D31"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFD07D"/>
      <stop offset="1" stop-color="#FF8A59"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#394469"/>
      <stop offset="1" stop-color="#252D49"/>
    </linearGradient>
    <radialGradient id="glowOne" cx="0" cy="0" r="1" gradientTransform="translate(110 180) rotate(35) scale(360 300)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4D8396" stop-opacity="0.72"/>
      <stop offset="1" stop-color="#4D8396" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowTwo" cx="0" cy="0" r="1" gradientTransform="translate(1110 565) rotate(-140) scale(390 290)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#985B8D" stop-opacity="0.62"/>
      <stop offset="1" stop-color="#985B8D" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="80" y="70" width="1040" height="560" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#050713" flood-opacity="0.55"/>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="640" rx="32" fill="url(#background)"/>
  <rect width="1200" height="640" rx="32" fill="url(#glowOne)"/>
  <rect width="1200" height="640" rx="32" fill="url(#glowTwo)"/>

  <g opacity="0.38">
