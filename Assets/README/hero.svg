    <circle cx="151" cy="87" r="6" fill="#FF8D76"/>
    <circle cx="171" cy="87" r="6" fill="#F7C36C"/>
    <circle cx="191" cy="87" r="6" fill="#8CD8A1"/>
    <rect x="174" y="145" width="390" height="10" rx="5" fill="#A8B4DD" fill-opacity="0.24"/>
