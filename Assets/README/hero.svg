    <text x="381" y="460" fill="#88E2C1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">@State selectedID</text>
    <text x="381" y="489" fill="#F7F8FF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">SwiftUI 焦点状态</text>
    <text x="381" y="520" fill="#8E99B7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Xcode · 2 分钟前</text>
  </g>

