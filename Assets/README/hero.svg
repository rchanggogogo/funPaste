  <text x="137" y="233" text-anchor="middle" fill="#2C1920" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="800">f</text>
  <text x="166" y="233" fill="#F7F8FF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700">funPaste</text>
  <circle cx="935" cy="226" r="5" fill="#88E2C1"/>
