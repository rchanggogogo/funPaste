    <text x="847" y="460" fill="#FFB97F" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">⌘ V</text>
    <text x="847" y="489" fill="#F7F8FF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">选中，即刻粘贴</text>
    <text x="847" y="520" fill="#8E99B7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">键盘优先 · 无需打断思路</text>
  </g>

  <rect x="875" y="598" width="235" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.07"/>
  <text x="992" y="617" text-anchor="middle" fill="#B8C1DA" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">⇧⌘V  ·  搜索  ·  回车粘贴</text>
