  <g>
    <rect x="126" y="420" width="222" height="122" rx="18" fill="url(#card)" stroke="#FF9F5B" stroke-width="2"/>
    <rect x="140" y="434" width="28" height="28" rx="8" fill="#FFFFFF" fill-opacity="0.09"/>
    <text x="154" y="453" text-anchor="middle" fill="#D7DDF0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">T</text>
    <text x="140" y="489" fill="#F7F8FF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">产品体验优先</text>
    <text x="140" y="516" fill="#BBC4DC" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">我只负责把控需求；实现交给你。</text>
