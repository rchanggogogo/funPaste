  <text x="126" y="390" fill="#F7F8FF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="30" font-weight="760">刚复制，也最应该先看到</text>
  <rect x="973" y="356" width="85" height="30" rx="15" fill="#B9A6FF" fill-opacity="0.14"/>
