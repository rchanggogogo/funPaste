    <text x="614" y="460" fill="#B9A6FF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">PROMPT</text>
    <text x="614" y="489" fill="#F7F8FF" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700">请帮我完成这个功能</text>
    <text x="614" y="520" fill="#8E99B7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">内置模板 · 常用</text>
  </g>

  <g opacity="0.66">
