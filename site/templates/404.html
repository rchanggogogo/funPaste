<!doctype html>
<html lang="en" data-lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none';" />
    <title>404 · funPaste</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/funPaste/assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/funPaste/assets/css/tokens.css" />
    <link rel="stylesheet" href="/funPaste/assets/css/site.css" />
  </head>
  <body>
    <main id="main" class="section">
      <div class="shell notfound">
        <h1>{{notFound.title}}</h1>
        <p>{{notFound.body}}</p>
        <div class="hero-cta notfound-actions">
          <a class="btn btn-primary" href="/funPaste/">{{notFound.back}}</a>
          <a class="btn btn-secondary" href="/funPaste/zh/" lang="zh-Hans">{{notFound.backZh}}</a>
        </div>
      </div>
    </main>
  </body>
</html>
