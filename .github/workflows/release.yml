name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build universal DMG
        run: bash scripts/build-dmg.sh "${GITHUB_REF_NAME#v}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/funPaste-${GITHUB_REF_NAME#v}.dmg" \
            --generate-notes \
            --title "funPaste $GITHUB_REF_NAME"
