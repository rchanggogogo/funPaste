name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run UI tests
        run: swift run FunPasteUITestRunner

      - name: Verify universal release build
        run: bash Tests/release-build-tests.sh
